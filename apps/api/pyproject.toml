[project]
name = "branchline"
version = "0.1.0"
description = "The board that stays true to the work."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "authlib>=1.3",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "celery>=5.4",
  "redis>=5.2",
  "tenacity>=9.0",
  "sentry-sdk>=2.19",
  "typer>=0.15",
  "pyjwt>=2.10",
]

[project.scripts]
branchline = "app.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
