name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: apps/api
        run: |
          python -m pip install fastapi 'uvicorn' 'sqlalchemy>=2' alembic pydantic-settings authlib httpx itsdangerous celery redis tenacity sentry-sdk typer pyjwt pytest
          python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Typecheck
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
